# pinned_runs.yaml — which run folders the MANUSCRIPT was made from.
#
# If you have just cloned the repository, there is no need to edit this file.
#   - The hourly_compiled / resampled_1km / kriging entries are the folders
#     `python pipeline/get_data.py --include interim` unpacks, so the
#     downloaded grids are picked up automatically.
#   - The model / benchmarking / ablations entries are the authors' own run
#     folders (results/legacy/..., not distributed).
#
# What reads it:
#   - pipeline/figures/manuscript_figures.py, by default (--inputs latest
#     ignores it; run_pipeline.py always passes --inputs latest).
#   - Any stage, when MROS_INPUTS=pinned is set.
#   - prune_runs: pinned runs are never deleted by keep_last.
#   - kriging_interpolation.py --test, as the reference run to compare with.
#
# Paths are relative to the repository root.
CA:
  hourly_compiled: data/interim/hourly_compiled/CA/20260528_compiled
  resampled_1km:   data/interim/resampled_1km/CA/20260528_resampled
  kriging:         data/interim/kriging/CA/20260806_kriging
  model:           results/legacy/model/CA/20260604_kriging
  benchmarking:    results/legacy/benchmarking/CA/20260728_benchmarking
  ablations:       results/legacy/ablations/CA/20260609_ablations
CO:
  hourly_compiled: data/interim/hourly_compiled/CO/20260528_compiled
  resampled_1km:   data/interim/resampled_1km/CO/20260528_resampled
  kriging:         data/interim/kriging/CO/20260806_kriging
  model:           results/legacy/model/CO/20260604_kriging
  benchmarking:    results/legacy/benchmarking/CO/20260728_benchmarking
  ablations:       results/legacy/ablations/CO/20260605_ablations
